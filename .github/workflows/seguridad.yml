name: Analisis de Seguridad (Trivy + ScanRepo)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  escaneo_seguridad:
    name: Ejecutar herramientas de control
    runs-on: ubuntu-latest

    steps:
      - name: Clonar codigo fuente
        uses: actions/checkout@v4

      # 1. Analizar con Aqua Security Trivy
      - name: Ejecutar Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'

      # 2. Analizar con ScanRepo
      - name: Ejecutar ScanRepo
        run: |
          npx scanrepo . --verdict
